# Builds the Windows app and the InDesign script.
# Runs on every pushed tag like v0.2.0 (and publishes a GitHub Release),
# or by hand from the Actions tab ("Run workflow").
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Test the parser (Python), the InDesign parser (JavaScript) and the InDesign script
        run: |
          python tests/test_parser.py
          python tests/js_parity.py
          python tests/indesign_mock_test.py

      - name: Build the .exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name ScriptureIndexBuilder
          --collect-data docx
          --hidden-import win32com.client --hidden-import pythoncom
          --add-data "scripture_index/js;scripture_index/js"
          run_app.py

      - name: Write the default InDesign script
        run: python -m scripture_index jsx "dist/Scripture Index Builder - English.jsx" --lang en

      - uses: actions/upload-artifact@v4
        with:
          name: ScriptureIndexBuilder
          path: dist/*

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
