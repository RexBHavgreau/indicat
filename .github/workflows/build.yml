# Builds the Windows app and the InDesign script.
# Runs on every pushed tag like v0.3.0 (and publishes a GitHub Release),
# or by hand from the Actions tab ("Run workflow").
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Test (Python and the InDesign JavaScript, which must agree)
        run: |
          python tests/test_parser.py
          python tests/test_terms.py
          python tests/test_note_matching.py
          python tests/js_parity.py
          python tests/terms_parity.py
          python tests/word_mock_test.py
          python tests/indesign_mock_test.py

      - name: Build the .exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Indicat
          --icon indicat/assets/indicat.ico
          --collect-data docx
          --hidden-import win32com.client --hidden-import pythoncom
          --add-data "indicat/js;indicat/js"
          --add-data "indicat/assets;indicat/assets"
          run_app.py

      - name: Write the default InDesign script
        run: python -m indicat jsx "dist/Indicat for InDesign.jsx" --lang en

      - uses: actions/upload-artifact@v4
        with:
          name: Indicat
          path: dist/*

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
